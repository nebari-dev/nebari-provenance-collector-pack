<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Provenance Collector</title>
    <script>
      // Apply the persisted theme before first paint to avoid a light/dark
      // flash. Generated by themeBootstrapScript("provenance:themeMode") from
      // @nebari/use-theme-preference (src/hooks/use-theme-preference.ts) —
      // re-generate rather than hand-editing, and keep the storage key in
      // sync with THEME_STORAGE_KEY in src/lib/theme.ts.
      (function () {
        var mode = null;
        var prefersDark = false;
        try {
          mode = localStorage.getItem("provenance:themeMode");
        } catch (e) {}
        try {
          prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        } catch (e) {}
        var isDark = mode === 'dark' || (mode !== 'light' && prefersDark);
        try {
          document.documentElement.classList.toggle('dark', isDark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
